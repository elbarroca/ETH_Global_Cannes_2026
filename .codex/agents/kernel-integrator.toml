Own src/auth/**, src/kernel/**, src/worker/**, protected app/api/auth/** and app/api/kernel/**, tests/auth/**, tests/kernel/**, tests/integration/worker-fencing.test.ts, and prisma/migrations/20260724024500_authenticated_kernel/**. ENS, 0G, payments, Telegram/cycle, and UI belong to their specialists. Preserve unrelated edits.

