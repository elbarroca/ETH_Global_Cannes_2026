name: CI

on:
  pull_request:
  push:

jobs:
  deterministic-foundation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_DB: alphadawg_ci
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/alphadawg_ci
      DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/alphadawg_ci
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      ENABLE_BACKGROUND_WORKERS: "false"
      ENABLE_KERNEL_WORKER: "false"
      ALPHADAWG_RUNTIME_MODE: protected
      SIWE_DOMAIN: localhost:3000
      SIWE_URI: http://localhost:3000
      SIWE_AUDIENCE: urn:alphadawg:kernel
      SIWE_CHAIN_ID: "5042002"
      NEXT_START_BOT: "false"
      # Public, deliberately non-live UUID used only so the client provider can prerender offline.
      NEXT_PUBLIC_DYNAMIC_ENVIRONMENT_ID: "00000000-0000-4000-8000-000000000000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          cache: npm
          node-version: 22
      - uses: actions/setup-go@v5
        with:
          go-version: 1.23.10
          cache-dependency-path: tools/0g-storage-verifier/go.sum
      - run: npm ci --legacy-peer-deps
      - run: npx prisma validate
      - run: npx prisma generate
      - run: npm run validate:env -- --require-database
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:auth
      - run: npm run test:kernel
      - run: npm run test:go
      - run: npm run test:integration
      - run: npm run test:e2e
      - run: npm run test:resilience
      - run: npm run test:redaction
      - run: npm run test:boot
      - run: npm run scan:secrets
      - run: npm run build
